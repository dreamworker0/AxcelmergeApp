<!DOCTYPE html>
<html lang="ko" translate="no">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 브라우저 확장 프로그램(DeepL, 번역기 등) 충돌 방지 패치
      // 이미 정의된 Custom Element를 다시 정의할 때 발생하는 에러를 무시합니다.
      const originalDefine = customElements.define;
      customElements.define = function(name, constructor, options) {
        if (!customElements.get(name)) {
          originalDefine.call(customElements, name, constructor, options);
        } else {
          console.warn(`[Extension Compatibility] Custom element "${name}" is already defined. Ignoring re-definition.`);
        }
      };
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>Excel Merger Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#2563eb',
              success: '#22c55e',
              danger: '#ef4444',
              excel: '#1D6F42', 
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
              'slide-up': 'slideUp 0.4s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(10px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
            },
          },
        },
      }
    </script>
